
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Katalog Produk</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  background: #f4f4f4;
  color: #171717;
  font-family: Arial, Helvetica, sans-serif;
}

.catalog {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.product {
  min-width: 0;
  background: #fff;
  overflow: hidden;
  display: block;
}

.product-media {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #e8e8e8;
}

/* THUMBNAIL PORTRAIT LEBIH PANJANG */
.product img.product-image {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  display: block;
}

/* LOGO SHOPEE PADA HOTSPOT */
.hotspot {
  position: absolute;
  left: var(--x);
  top: var(--y);

  transform: translate(-50%, -50%);

  width: clamp(18px, 3.5vw, 30px);
  height: clamp(18px, 3.5vw, 30px);

  display: flex;
  align-items: center;
  justify-content: center;

  background: #fff;
  border-radius: 50%;
  padding: 2px;

  box-shadow: 0 2px 7px rgba(0,0,0,.22);

  z-index: 5;
  text-decoration: none;
  cursor: pointer;

  transition: transform .16s ease;
  -webkit-tap-highlight-color: transparent;
}

/* GAMBAR LOGO */
.hotspot img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 50%;
}

/* POSISI PALING ATAS */
.hotspot.edge-top {
  top: 0;
  transform: translate(-50%, 0);
}

.hotspot.edge-top:hover {
  transform: translate(-50%, 0) scale(1.12);
}

/* POSISI PALING BAWAH */
.hotspot.edge-bottom {
  top: 100%;
  transform: translate(-50%, -100%);
}

.hotspot.edge-bottom:hover {
  transform: translate(-50%, -100%) scale(1.12);
}

/* POSISI NORMAL */
.hotspot:not(.edge-top):not(.edge-bottom):hover {
  transform: translate(-50%, -50%) scale(1.12);
}

.hotspot:focus-visible {
  outline: 2px solid #333;
  outline-offset: 2px;
}

/* JUDUL PRODUK */
.product-title {
  padding: 14px 16px 17px;
  font-size: clamp(17px, 2.3vw, 25px);
  line-height: 1.25;
  font-weight: 400;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;

  overflow: hidden;
  overflow-wrap: anywhere;
  min-height: 78px;
}

.status {
  grid-column: 1 / -1;
  text-align: center;
  color: #777;
  padding: 28px 10px;
  background: #fff;
}

/* TAMPILAN HP */
@media(max-width:560px) {

  body {
    padding: 9px;
  }

  .catalog {
    gap: 10px;
  }

  .product-title {
    padding: 10px 10px 13px;
    font-size: clamp(15px, 4.1vw, 19px);
    min-height: 68px;
  }

  .hotspot {
    width: 50px;
    height: 50px;
  }

}
</style>
</head>

<body>

<main class="catalog" id="catalog">
  <div class="status">Memuat produk...</div>
</main>

<script>

const JSON_URL = "./products.json";

/* LOGO SHOPEE */
const SHOPEE_LOGO = "https://cdn.aceimg.com/xk1hNOWtK.jpg";


async function loadProducts() {

  const catalog = document.getElementById("catalog");

  try {

    const response = await fetch(JSON_URL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Gagal membaca products.json");
    }

    const products = await response.json();

    catalog.innerHTML = "";

    if (!Array.isArray(products) || products.length === 0) {
      catalog.innerHTML =
        '<div class="status">Belum ada produk.</div>';
      return;
    }

    /*
      PRODUK TERBARU PALING ATAS

      Data products.json tetap tidak diubah.
      Hanya urutan tampilannya yang dibalik.
    */

    const sortedProducts = [...products].reverse();

    sortedProducts.forEach(item => {

      if (!item.image) return;

      const card = document.createElement("article");
      card.className = "product";

      const media = document.createElement("div");
      media.className = "product-media";

      /* GAMBAR PRODUK */
      const img = document.createElement("img");

      img.className = "product-image";
      img.src = item.image;
      img.alt = item.title || "Foto produk";
      img.loading = "lazy";
      img.decoding = "async";

      img.onerror = () => {
        img.style.visibility = "hidden";
        media.style.background = "#e8e8e8";
      };

      media.appendChild(img);

      /* MEMBUAT HOTSPOT LOGO */
      if (Array.isArray(item.hotspots)) {

        item.hotspots.forEach(spot => {

          if (!spot.directlink) return;

          const dot = document.createElement("a");

          dot.className = "hotspot";

          dot.href = spot.directlink;
          dot.target = "_blank";
          dot.rel = "noopener noreferrer";

          dot.setAttribute(
            "aria-label",
            spot.label || "Buka produk Shopee"
          );

          dot.title = spot.label || "Buka produk Shopee";

          const x = Number(spot.x);
          const y = Number(spot.y);

          dot.style.setProperty(
            "--x",
            (Number.isFinite(x) ? x : 50) + "%"
          );

          dot.style.setProperty(
            "--y",
            (Number.isFinite(y) ? y : 50) + "%"
          );

          /* POSISI TEPI ATAS DAN BAWAH */
          if (spot.edge === "top") {
            dot.classList.add("edge-top");
          }

          if (spot.edge === "bottom") {
            dot.classList.add("edge-bottom");
          }

          /* LOGO SHOPEE */
          const logo = document.createElement("img");

          logo.src = SHOPEE_LOGO;
          logo.alt = "";
          logo.setAttribute("aria-hidden", "true");

          dot.appendChild(logo);

          media.appendChild(dot);

        });

      }

      /* JUDUL PRODUK */
      const title = document.createElement("div");

      title.className = "product-title";
      title.textContent = item.title || "Tanpa judul";

      card.append(media, title);

      catalog.appendChild(card);

    });

    if (!catalog.children.length) {
      catalog.innerHTML =
        '<div class="status">Data produk belum lengkap. Periksa image di products.json.</div>';
    }

  } catch (error) {

    catalog.innerHTML =
      '<div class="status">Tidak bisa memuat data. Pastikan index.html dan products.json berada di folder yang sama dan dibuka melalui hosting/web server.</div>';

    console.error(error);

  }

}

loadProducts();

</script>

</body>
</html>
