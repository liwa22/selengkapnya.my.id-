<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Katalog Produk</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      background: #f4f4f4;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }
    .catalog {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .product {
      min-width: 0;
      background: #fff;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform .15s ease;
    }
    .product:active { transform: scale(.99); }
    .product img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #e8e8e8;
    }
    .product-title {
      padding: 14px 16px 17px;
      font-size: clamp(17px, 2.3vw, 25px);
      line-height: 1.25;
      font-weight: 400;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
      min-height: 78px;
    }
    .status {
      grid-column: 1 / -1;
      text-align: center;
      color: #777;
      padding: 28px 10px;
      background: #fff;
    }
    @media (max-width: 560px) {
      body { padding: 9px; }
      .catalog { gap: 10px; }
      .product-title {
        padding: 10px 10px 13px;
        font-size: clamp(15px, 4.1vw, 19px);
        min-height: 68px;
      }
    }
  </style>
</head>
<body>
  <main class="catalog" id="catalog">
    <div class="status">Memuat produk...</div>
  </main>

  <script>
    const JSON_URL = "./products.json";

    async function loadProducts() {
      const catalog = document.getElementById("catalog");

      try {
        const response = await fetch(JSON_URL, { cache: "no-store" });
        if (!response.ok) throw new Error("Gagal membaca products.json");
        const products = await response.json();

        catalog.innerHTML = "";

        if (!Array.isArray(products) || products.length === 0) {
          catalog.innerHTML = '<div class="status">Belum ada produk.</div>';
          return;
        }

        products.forEach((item) => {
          if (!item.image || !item.directlink) return;

          const card = document.createElement("a");
          card.className = "product";
          card.href = item.directlink;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.setAttribute("aria-label", item.title || "Lihat produk");

          const img = document.createElement("img");
          img.src = item.image;
          img.alt = item.title || "Foto produk";
          img.loading = "lazy";
          img.decoding = "async";
          img.onerror = () => {
            img.style.visibility = "hidden";
            img.parentElement.style.background = "#e8e8e8";
          };

          const title = document.createElement("div");
          title.className = "product-title";
          title.textContent = item.title || "Tanpa judul";

          card.append(img, title);
          catalog.appendChild(card);
        });

        if (!catalog.children.length) {
          catalog.innerHTML = '<div class="status">Data produk belum lengkap. Periksa image dan directlink di products.json.</div>';
        }
      } catch (error) {
        catalog.innerHTML = '<div class="status">Tidak bisa memuat data. Pastikan index.html dan products.json berada di folder yang sama dan dibuka melalui hosting/web server.</div>';
        console.error(error);
      }
    }

    loadProducts();
  </script>
</body>
</html>
